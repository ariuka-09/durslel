# Two callers, one document: the history sidebar asks for its own (no creatorId) and the admin
# dashboard names a person. The sidebar reads only the first four fields; the rest are what a
# dashboard card shows, and are cheap enough not to be worth a second query to avoid.
query GetRenders($creatorId: ID) {
  getRenders(creatorId: $creatorId) {
    id
    jobId
    title
    url
    status
    error
    prompt
    sceneClass
    attempts
    durationMs
    createdAt
  }
}

# The admin chart's second series. Two fields only — it counts rows per month and draws nothing
# else, so pulling a card's worth of columns for every render on the service would be waste.
query AllRenders {
  allRenders {
    id
    createdAt
  }
}

# What the progress bar polls while a render is in flight.
query GetRender($id: ID!) {
  getRender(id: $id) {
    id
    jobId
    title
    url
    status
    error
    createdAt
  }
}

mutation StartRender($prompt: String!, $lang: String) {
  startRender(prompt: $prompt, lang: $lang) {
    id
    jobId
    title
    url
    status
    createdAt
  }
}

mutation DeleteRender($id: ID!) {
  deleteRender(id: $id)
}
