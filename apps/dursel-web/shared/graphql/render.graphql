query GetRenders {
  getRenders {
    id
    jobId
    title
    url
    status
    createdAt
  }
}

# What the progress bar polls while a render is in flight.
query GetRender($id: ID!) {
  getRender(id: $id) {
    id
    jobId
    title
    url
    status
    error
    createdAt
  }
}

mutation StartRender($prompt: String!) {
  startRender(prompt: $prompt) {
    id
    jobId
    title
    url
    status
    createdAt
  }
}

mutation DeleteRender($id: ID!) {
  deleteRender(id: $id)
}
