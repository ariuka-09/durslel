overwrite: true
schema: './apps/durslel-service/src/schemas/*.schema.ts'
generates:
  ./apps/durslel-service/src/types/generated.ts:
    plugins:
      - typescript
      - typescript-resolvers
    config:
      contextType: Context
      # Resolvers return database rows; the schema's computed fields (User.subscription applying
      # its expiry, User.dailyLimit from the tier) are filled in by field resolvers. Without this
      # mapping every resolver returning a row fails to typecheck the moment the schema grows a
      # field that is not a column.
      mappers:
        User: '../drizzle-config#UserRow'
      makeResolverTypeCallable: true
      maybeValue: T | null
      inputMaybeValue: T
